services:
  signaling:
    build: .
    container_name: codechat-signaling
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_PRETTY: "false"
      # CORS_ORIGINS: https://app.ghostmessenger.io
      # TURN_URLS: turn:turn:3478
      # TURN_SECRET: ${TURN_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Redis service for horizontal scaling
  redis:
    image: redis:7-alpine
    container_name: codechat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3

  # TURN server (coturn) for symmetric NAT traversal
  turn:
    image: coturn/coturn:latest
    container_name: codechat-turn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    environment:
      TURN_SECRET: ${TURN_SECRET}
      TURN_TTL_SECONDS: 1800
      TURN_REALM: ${TURN_REALM}
    command: >
      -n
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${TURN_REALM}
      --no-tls
      --no-dtls
      --no-cli

  # Caddy reverse proxy for HTTPS/WSS and automatic TLS
  caddy:
    image: caddy:latest
    container_name: codechat-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_AGREED: "yes"

volumes:
  caddy_data:
  caddy_config:
