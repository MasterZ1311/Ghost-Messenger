services:
  signaling:
    build: .
    container_name: codechat-signaling
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_PRETTY: "false"
      # CORS_ORIGINS: https://app.ghostmessenger.io
      # TURN_URLS: turn:turn:3478
      # TURN_SECRET: ${TURN_SECRET}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3

  # Optional self-hosted TURN server for reliable NAT traversal.
  # Uncomment and set TURN_SECRET (shared with the signaling service above)
  # to enable ephemeral TURN credentials via /api/ice-servers.
  #
  # turn:
  #   image: coturn/coturn:latest
  #   container_name: codechat-turn
  #   restart: unless-stopped
  #   network_mode: host
  #   command: >
  #     -n
  #     --use-auth-secret
  #     --static-auth-secret=${TURN_SECRET}
  #     --realm=ghostmessenger.io
  #     --no-tls
  #     --no-dtls
  #     --no-cli
